services:
  - type: web
    name: munchbox-backend
    runtime: node
    rootDir: backend
    # Installs backend deps, then builds the PWA (customer/shop/delivery web app) so
    # the backend can serve it as static files at the same URL — see server.js.
    buildCommand: npm install && cd ../pwa && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
